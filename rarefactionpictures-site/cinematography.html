<!-- ============ REEL — full-page hero ============
  EDIT ME: currently playing a placeholder (Big Buck Bunny, CC BY 3.0,
  Blender Foundation) so the player isn't empty. Replace the <source>
  src below with your real reel once you have one. No poster set —
  it shows the video's own first frame.
-->
<section class="reel">
  <div class="reel-player">
    <video class="reel-video" autoplay muted loop playsinline preload="auto">
      <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
    </video>
    <div class="reel-fade"></div>
    <div class="reel-placeholder-label" id="reelPlaceholderLabel">
      [ Reel goes here ]<br>Drop an mp4 in <code>videos/</code> and update the &lt;source&gt; tag in this file
    </div>
    <button class="reel-mute-toggle" aria-label="Toggle sound">🔇</button>
  </div>
</section>

<!-- ============ STILLS ============
  EDIT ME: each .cine-slide is one still; data-title is the project name shown on hover.
  Grid stills: drop images into images/grid/ and add their filenames to the list below.
-->
<section class="cine-unit">
  <div class="wrap">
    <p class="section-label" style="text-align:center; margin-bottom:24px;">Stills</p>

    <div class="cine-carousel">
      <div class="cine-viewport">
        <div class="cine-peek cine-peek--left"></div>
        <div class="cine-peek cine-peek--right"></div>
        <div class="cine-track">
          <div class="cine-slide" data-title="NOON"><div class="cine-frame"><img src="images/still-01.jpg" alt="NOON still"></div></div>
          <div class="cine-slide" data-title="NOON"><div class="cine-frame"><img src="images/still-02.jpg" alt="NOON still"></div></div>
          <div class="cine-slide" data-title="NOON"><div class="cine-frame"><img src="images/still-03.jpg" alt="NOON still"></div></div>
          <div class="cine-slide" data-title="NOON"><div class="cine-frame"><img src="images/still-04.jpg" alt="NOON still"></div></div>
        </div>
      </div>
      <button class="cine-arrow cine-arrow--prev" aria-label="Previous still">‹</button>
      <button class="cine-arrow cine-arrow--next" aria-label="Next still">›</button>
      <div class="cine-dots"></div>
    </div>

    <div class="still-grid" id="stillGrid"></div>
  </div>
</section>

<script>
